<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ARMED FORCES INTRO</title>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

/* ФОН */
.bg {
  position: absolute;
  width: 100%;
  height: 100%;
  background: url("https://images.unsplash.com/photo-1541873676-a18131494184") center/cover;
  filter: brightness(0.3) contrast(1.2);
  animation: zoom 20s infinite;
}

/* ДЫМ */
.smoke {
  position: absolute;
  width: 100%;
  height: 100%;
  background: url("https://i.imgur.com/4NJlB7v.png");
  opacity: 0.2;
  animation: moveSmoke 10s infinite linear;
}

/* ТЁМНЫЙ ОВЕРЛЕЙ */
.overlay {
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle, transparent, black 80%);
}

/* ТЕКСТ */
.title {
  position: absolute;
  top: 50%;
  width: 100%;
  text-align: center;
  transform: translateY(-50%);
  color: white;
  font-size: 70px;
  letter-spacing: 6px;

  animation: glitch 2s infinite;
}

.subtitle {
  position: absolute;
  top: 60%;
  width: 100%;
  text-align: center;
  color: #aaa;
  font-size: 20px;
  letter-spacing: 3px;
  opacity: 0;
  animation: fadeIn 3s forwards 2s;
}

/* КНОПКА */
.btn {
  position: absolute;
  top: 70%;
  left: 50%;
  transform: translateX(-50%);
  padding: 12px 25px;
  border: 1px solid white;
  color: white;
  text-decoration: none;
  opacity: 0;
  animation: fadeIn 3s forwards 3s;
}

/* АНИМАЦИИ */
@keyframes zoom {
  0% { transform: scale(1); }
  50% { transform: scale(1.1); }
  100% { transform: scale(1); }
}

@keyframes moveSmoke {
  from { transform: translateX(0); }
  to { transform: translateX(-200px); }
}

@keyframes fadeIn {
  to { opacity: 1; }
}

/* GLITCH ЭФФЕКТ */
@keyframes glitch {
  0% { transform: translate(0); }
  20% { transform: translate(-2px,2px); }
  40% { transform: translate(2px,-2px); }
  60% { transform: translate(-1px,1px); }
  80% { transform: translate(1px,-1px); }
  100% { transform: translate(0); }
}
</style>

</head>
<body>

<div class="bg"></div>
<div class="smoke"></div>
<div class="overlay"></div>

<h1 class="title">ARMED FORCES</h1>
<p class="subtitle">Продажа военной техники</p>

<a href="index.html" class="btn">ENTER SITE</a>

</body>
</html>
